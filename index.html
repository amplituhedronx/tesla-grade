<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Grade</title>
  <style>
    :root {
      --bg: #000; --surface: #171a20; --raised: #2a2d34; --ink: #fff;
      --muted: #8e8e8e; --dim: #5c5e62; --blue: #3e6ae1;
      --ok: #3dd68c; --warn: #f5a524; --bad: #e82127;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink);
      font-family: Inter, "Universal Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select: none; }
    body { display: flex; flex-direction: column; min-height: 100vh; padding: 10px 14px 14px; gap: 10px; }
    header { display: flex; align-items: center; justify-content: space-between; height: 44px; flex: 0 0 44px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    .dot.live { background: var(--ok); } .dot.wait { background: var(--warn); } .dot.off { background: var(--bad); }
    .toggles { display: flex; gap: 8px; }
    .seg { display: flex; background: var(--surface); border-radius: 6px; padding: 3px; }
    .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 500; padding: 6px 14px; border-radius: 4px; min-height: 34px; }
    .seg button.on { background: var(--raised); color: #fff; }
    .top { display: flex; gap: 10px; align-items: stretch; }
    .hero, .incline, .profile { background: var(--surface); border-radius: 10px; min-width: 0; }
    .hero { flex: 0 0 50%; min-width: 320px; display: flex; flex-direction: column; align-items: stretch; justify-content: center; padding: 16px 18px 12px; position: relative; overflow: visible; }
    .incline { flex: 1; padding: 10px 16px 8px; }
    .k { font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
    .hero .k { position: absolute; top: 12px; left: 18px; }
    .alt-wrap { display: flex; align-items: flex-end; justify-content: center; gap: 8px; line-height: 0.9; margin-top: 10px; min-width: 0; }
    .alt { font-size: clamp(40px, 5.2vw, 58px); font-weight: 500; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .alt-unit { font-size: 18px; color: var(--muted); padding-bottom: 6px; flex: 0 0 auto; }
    .hero-meta { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 13px; }
    .hero-meta span { white-space: nowrap; }
    .hero-meta b { color: #fff; font-weight: 500; font-variant-numeric: tabular-nums; }
    .speed { margin-top: 4px; font-size: 13px; color: var(--muted); text-align: center; }
    .incline-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .grade-read { font-size: 36px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .vs-read { font-size: 15px; color: var(--muted); }
    #inclineSvg { display: block; width: 100%; height: 110px; }
    .profile { padding: 10px 14px 12px; }
    .profile-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
    .profile-stats { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
    #profileSvg { display: block; width: 100%; height: 240px; background: #12151a; border-radius: 6px; }
    .gate { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 5; }
    .gate.show { display: flex; }
    .gate-card { background: var(--surface); border-radius: 12px; padding: 28px; max-width: 420px; text-align: center; }
    .gate-card h2 { margin: 0 0 8px; font-size: 22px; font-weight: 500; }
    .gate-card p { margin: 0 0 20px; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .cta { appearance: none; border: 0; background: var(--blue); color: #fff; font: inherit; font-size: 16px; border-radius: 4px; min-height: 52px; width: 100%; }
    @media (max-width: 820px) {
      .top { flex-direction: column; }
      .hero { flex: 1 1 auto; min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Grade</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Waiting for GPS</span></div>
    </div>
    <div class="toggles">
      <div class="seg"><button id="btnSim" type="button">Sim</button><button id="btnGps" class="on" type="button">GPS</button></div>
      <div class="seg"><button id="btnM" class="on" type="button">m</button><button id="btnFt" type="button">ft</button></div>
    </div>
  </header>
  <div class="top">
    <section class="hero">
      <div class="k">Altitude</div>
      <div class="alt-wrap"><div class="alt" id="alt">—</div><div class="alt-unit" id="altUnit">m</div></div>
      <div class="hero-meta"><span>GPS <b id="gpsAlt">—</b></span><span>Terrain <b id="terrainAlt">—</b></span></div>
      <div class="speed" id="speed">—</div>
    </section>
    <section class="incline">
      <div class="incline-head">
        <span class="k">Grade</span>
        <span class="grade-read" id="grade">0%</span>
        <span class="vs-read" id="vs">0 m/min</span>
      </div>
      <svg id="inclineSvg" viewBox="0 0 800 110" preserveAspectRatio="none">
        <line id="inclineZero" x1="30" y1="55" x2="770" y2="55" stroke="#8e8e8e" stroke-width="1.5"/>
        <polygon id="inclineWedge" fill="rgba(62,106,225,0.15)"/>
        <rect id="inclineBar" x="-312" y="-15" width="624" height="30" rx="6" fill="none" stroke="#3e6ae1" stroke-width="2.5"/>
      </svg>
    </section>
  </div>
  <section class="profile">
    <div class="profile-head">
      <span class="k">Altitude profile</span>
      <div class="profile-stats">
        <span id="gain">↑ 0 m</span>
        <span id="loss">↓ 0 m</span>
        <span id="profileRange">no samples</span>
      </div>
    </div>
    <svg id="profileSvg" viewBox="0 0 1000 220" preserveAspectRatio="xMidYMid meet">
      <rect width="1000" height="220" fill="#12151a"/>
      <path id="profileAxes" d="M100 16 V188 H976" fill="none" stroke="#2c2f36" stroke-width="1"/>
      <path id="profileFill" fill="rgba(62,106,225,0.22)" d=""/>
      <path id="profileLine" fill="none" stroke="#3e6ae1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" d=""/>
      <path id="profileAhead" fill="none" stroke="#7aa2ff" stroke-width="3" stroke-dasharray="10 8" stroke-linejoin="round" stroke-linecap="round" d=""/>
      <circle id="profileDot" cx="-20" cy="-20" r="5" fill="#fff"/>
      <text id="profileMax" x="92" y="24" fill="#8e8e8e" font-size="13" text-anchor="end"></text>
      <text id="profileMin" x="92" y="188" fill="#8e8e8e" font-size="13" text-anchor="end"></text>
      <text id="profileX0" x="100" y="210" fill="#8e8e8e" font-size="13">0.00 km</text>
      <text id="profileX1" x="530" y="210" fill="#8e8e8e" font-size="14" text-anchor="middle"></text>
      <text id="profileX2" x="980" y="210" fill="#8e8e8e" font-size="14" text-anchor="end"></text>
      <text id="profileHint" x="530" y="110" fill="#8e8e8e" font-size="16" text-anchor="middle">Waiting for GPS</text>
      <g id="profileLabels"></g>
    </svg>
  </section>
  <div class="gate" id="gate">
    <div class="gate-card">
      <h2 id="gateTitle">Enable location</h2>
      <p id="gateText">Allow GPS, or tap Sim to preview the profile.</p>
      <button class="cta" id="askLoc" type="button">Enable location</button>
    </div>
  </div>
  <script src="p1.js?v=21"></script>
  <script src="p2.js?v=21"></script>
  <script src="p3.js?v=21"></script>
</body>
</html>
