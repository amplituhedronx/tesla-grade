<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Grade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --surface: #171a20;
      --ink: #ffffff;
      --muted: #8e8e8e;
      --dim: #5c5e62;
      --blue: #3e6ae1;
      --blue-press: #2d58cc;
      --ok: #3dd68c;
      --warn: #f5a524;
      --bad: #e82127;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: Inter, "Universal Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 400; letter-spacing: -0.01em; overflow: hidden; user-select: none;
    }
    body { display: flex; flex-direction: column; padding: 16px 20px 14px; gap: 12px; }
    header { display: flex; align-items: center; justify-content: space-between; min-height: 40px; flex-shrink: 0; }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    .dot.live { background: var(--ok); box-shadow: 0 0 0 4px rgba(61, 214, 140, 0.15); }
    .dot.wait { background: var(--warn); }
    .dot.off { background: var(--bad); }
    .units { display: flex; background: var(--surface); border-radius: 6px; padding: 3px; }
    .units button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 4px; min-height: 36px; }
    .units button.on { background: #2a2d34; color: var(--ink); }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 0.9fr 1.4fr; grid-template-rows: 1fr auto; gap: 12px; }
    .hero, .incline, .profile { background: var(--surface); border-radius: 12px; position: relative; min-height: 0; }
    .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 12px 14px; }
    .k { font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
    .hero .k { position: absolute; top: 14px; left: 16px; }
    .alt-wrap { display: flex; align-items: flex-end; gap: 10px; line-height: 0.85; }
    .alt { font-size: clamp(64px, 16vh, 120px); font-weight: 500; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .alt-unit { font-size: 22px; font-weight: 500; color: var(--muted); padding-bottom: 10px; }
    .hero-meta { margin-top: 14px; display: flex; gap: 16px; color: var(--muted); font-size: 14px; }
    .hero-meta b { color: var(--ink); font-weight: 500; }
    .incline { display: flex; flex-direction: column; padding: 12px 12px 8px; }
    .incline-head { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 6px 6px; }
    .grade-read { font-size: clamp(28px, 5vh, 40px); font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .vs-read { font-size: 15px; color: var(--muted); }
    #inclineCanvas { width: 100%; flex: 1; min-height: 0; display: block; }
    .profile { grid-column: 1 / -1; display: flex; flex-direction: column; padding: 12px 14px 10px; min-height: 160px; }
    .profile-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .profile-head .range { font-size: 13px; color: var(--muted); }
    #profileCanvas { width: 100%; flex: 1; min-height: 120px; display: block; }
    .gate { position: absolute; inset: 0; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; padding: 24px; }
    .gate.show { display: flex; }
    .gate-card { background: var(--surface); border-radius: 12px; padding: 28px 28px 24px; max-width: 420px; text-align: center; }
    .gate-card h2 { margin: 0 0 8px; font-size: 22px; font-weight: 500; }
    .gate-card p { margin: 0 0 20px; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .cta { appearance: none; border: 0; background: var(--blue); color: #fff; font: inherit; font-size: 16px; font-weight: 500; border-radius: 4px; min-height: 52px; width: 100%; }
    .cta:active { background: var(--blue-press); }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
      .hero { min-height: 140px; }
      .alt { font-size: clamp(56px, 14vh, 88px); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Grade</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Waiting for GPS</span>
      </div>
    </div>
    <div class="units" role="group" aria-label="Units">
      <button id="btnM" class="on">m</button>
      <button id="btnFt">ft</button>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="k">Altitude</div>
      <div class="alt-wrap">
        <div class="alt" id="alt">—</div>
        <div class="alt-unit" id="altUnit">m</div>
      </div>
      <div class="hero-meta">
        <span>GPS <b id="gpsAlt">—</b></span>
        <span>Terrain <b id="terrainAlt">—</b></span>
      </div>
    </section>
    <section class="incline">
      <div class="incline-head">
        <span class="k">Grade</span>
        <span class="grade-read" id="grade">0%</span>
        <span class="vs-read" id="vs">0 m/min</span>
      </div>
      <canvas id="inclineCanvas"></canvas>
    </section>
    <section class="profile">
      <div class="profile-head">
        <span class="k">Altitude profile</span>
        <span class="range" id="profileRange">last 8 min</span>
      </div>
      <canvas id="profileCanvas"></canvas>
    </section>
  </main>
  <div class="gate" id="gate">
    <div class="gate-card">
      <h2 id="gateTitle">Enable location</h2>
      <p id="gateText">Allow GPS so Grade can tilt the road and draw the altitude trace.</p>
      <button class="cta" id="askLoc" type="button">Enable location</button>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
